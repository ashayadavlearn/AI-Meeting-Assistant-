version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meetbuddy-backend
    ports:
      - "8001:8001"
    environment:
      - SECRET_KEY=meetbuddy-ai-super-secret-key-production-jwt-2025
      - DATABASE_URL=sqlite:///./meetbuddy.db
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
    volumes:
      - ./backend/meetbuddy.db:/app/meetbuddy.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meetbuddy-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
